name: TuXun Worker Version Upload

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type UPLOAD_TUXUN_VERSION to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tuxun-worker-version-upload
  cancel-in-progress: false

jobs:
  upload-version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify manual confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          if [[ "$CONFIRM" != "UPLOAD_TUXUN_VERSION" ]]; then
            echo "Manual confirmation must be exactly UPLOAD_TUXUN_VERSION."
            exit 1
          fi

      - name: Verify TuXun Cloudflare account
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ "$CLOUDFLARE_ACCOUNT_ID" != "fb7265417723b65d5ee07769bfb2b1f0" ]]; then
            echo "Cloudflare account ID does not match the TuXun account."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployment configuration
        shell: bash
        run: |
          config="wrangler.jsonc"
          required_values=(
            '"name": "tuxun-ai-site"'
            '"MUMO_PUBLIC_ORIGIN": "https://tuxun-ai-site.qianning321.workers.dev"'
            '"database_id": "8bd50d9c-0a63-426e-bdaf-f83a42c9b1d7"'
            '"bucket_name": "tuxun-ai-generated-images"'
            '"binding": "MUMO_DB"'
            '"binding": "MUMO_GENERATED_IMAGES"'
          )
          for value in "${required_values[@]}"; do
            if ! grep -Fq "$value" "$config"; then
              echo "Missing required wrangler.jsonc configuration."
              exit 1
            fi
          done
          if grep -Fq 'your-tuxun-r2-public-domain.example' "$config"; then
            echo "Placeholder R2 public domain must not be present."
            exit 1
          fi
          if grep -Fq 'R2_PUBLIC_BASE_URL' "$config"; then
            echo "R2_PUBLIC_BASE_URL must not be present in wrangler.jsonc."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Upload Worker Version only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.84.1 versions upload
