name: TuXun D1 Schema Initialize

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type INITIALIZE_TUXUN_D1 to continue"
        required: true
        type: string

permissions:
  contents: read

jobs:
  initialize-d1:
    name: Initialize TuXun D1
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Verify manual confirmation
        shell: bash
        run: |
          if [ "${{ inputs.confirm }}" != "INITIALIZE_TUXUN_D1" ]; then
            echo "Confirmation text does not match."
            exit 1
          fi

      - name: Verify TuXun Cloudflare account
        shell: bash
        run: |
          if [ "$CLOUDFLARE_ACCOUNT_ID" != "fb7265417723b65d5ee07769bfb2b1f0" ]; then
            echo "Cloudflare account mismatch."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify migration baseline
        shell: bash
        run: |
          count=$(find migrations/d1 -maxdepth 1 -type f -name '*.sql' | wc -l)
          latest=$(find migrations/d1 -maxdepth 1 -type f -name '*.sql' | sort | tail -n 1)

          echo "Migration count: $count"
          echo "Latest migration: $latest"

          if [ "$count" -ne 13 ]; then
            echo "Expected exactly 13 migrations."
            exit 1
          fi

          case "$latest" in
            *0013_*) ;;
            *)
              echo "Expected migration chain to end at 0013."
              exit 1
              ;;
          esac

      - name: Show pending migrations
        run: npx --yes wrangler@4.84.1 d1 migrations list MUMO_DB --remote

      - name: Apply migrations to TuXun D1
        run: npx --yes wrangler@4.84.1 d1 migrations apply MUMO_DB --remote

      - name: Verify migration state
        run: npx --yes wrangler@4.84.1 d1 migrations list MUMO_DB --remote
